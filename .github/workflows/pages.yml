name: pages

# Pages is not enabled on this repository yet, and the GitHub App in use cannot
# create the site (create-pages returns 403). Turn Pages on once — Settings →
# Pages → Source: GitHub Actions — then run this workflow by hand, or switch the
# source to "Deploy from a branch: main /docs" and drop this file entirely.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
